<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election and Representation - Mock Test</title>
<style>
:root{--ink:#1b2a4a;--muted:#5b6578;--bg:#f5f6fa;--card:#fff;--line:#d9deea;--accent:#e07b00;--ok:#1e8e4e;--okbg:#e3f5ea;--bad:#c62828;--badbg:#fdeaea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{background:var(--ink);color:#fff;padding:16px 14px}
header .in{max-width:640px;margin:0 auto}
h1{font-size:1.2rem;margin:0 0 4px}
header p{margin:0;font-size:.85rem;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nav button{height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:1rem;font-weight:600;color:var(--ink)}
.nav button.done{background:var(--ink);border-color:var(--ink);color:#fff}
.nav button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.legend{font-size:.8rem;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--ink);border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.tag{background:#fff3e0;color:#9a5200;border-radius:20px;padding:2px 10px;font-weight:600}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px;margin-bottom:10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1rem;color:var(--ink);font-family:inherit}
.opt b{min-width:24px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{font-weight:600;margin:4px 0 0;padding:10px 12px;border-radius:8px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border:0;border-radius:10px;font-size:1rem;font-weight:600;font-family:inherit;background:var(--ink);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.go{background:var(--accent)}
.btn:disabled{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:20px;max-width:380px;width:100%}
.big{font-size:2.6rem;font-weight:800;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted);margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:6px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-size:.95rem}
th:first-child,td:first-child{text-align:left}
h2{font-size:1.1rem;margin:0 0 6px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv:first-of-type{border-top:0}
.rv p{margin:4px 0}
.g{color:var(--ok);font-weight:600}.r{color:var(--bad);font-weight:600}.n{color:var(--muted);font-weight:600}
.hide{display:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="in"><h1>Election and Representation</h1><p>Class 11 Political Science &bull; Bihar Board &bull; 15 Questions &bull; 15 Marks &bull; No negative marking</p></div></header>
<div class="wrap">
<div id="test">
  <div class="card">
    <div class="nav" id="nav"></div>
    <div class="legend"><span><i class="d"></i>Attempted</span><span><i></i>Not attempted</span></div>
  </div>
  <div class="card">
    <div class="meta"><span id="qno"></span><span class="tag" id="lvl"></span></div>
    <p class="q" id="qtext"></p>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="row">
      <button class="btn alt" id="prev">Previous</button>
      <button class="btn" id="next">Next</button>
    </div>
  </div>
  <div class="row"><button class="btn go" id="submit">Submit Test</button></div>
</div>

<div id="result" class="hide">
  <div class="card">
    <p class="big" id="score"></p>
    <p class="sub" id="pct"></p>
    <div class="stats" id="stats"></div>
  </div>
  <div class="card"><h2>Performance by level</h2>
    <table id="brk"></table></div>
  <div class="card"><h2>Review answers</h2><div id="review"></div></div>
  <div class="row"><button class="btn go" id="restart">Restart Test</button></div>
</div>
</div>

<div class="modal" id="modal"><div class="box">
  <h2>Submit the test?</h2>
  <p id="mtxt"></p>
  <div class="row"><button class="btn alt" id="mno">Go back</button><button class="btn go" id="myes">Yes, submit</button></div>
</div></div>

<script>
var Q=[
["Easy","Why are elections important in a democracy?",["They allow people to choose their representatives.","They allow rulers to rule forever.","They stop people from voting.","They remove the Constitution."],0],
["Easy","What is a constituency?",["A political party","A geographical area from which a representative is elected","A government office","A voting machine"],1],
["Easy","What is the minimum voting age in India?",["16 years","21 years","18 years","25 years"],2],
["Easy","What does universal adult franchise mean?",["Only rich people can vote.","Only educated people can vote.","Only government employees can vote.","All adult citizens have the right to vote, subject to law."],3],
["Easy","Which institution conducts elections in India?",["Supreme Court","Election Commission of India","Parliament","Planning Commission"],1],
["Moderate","What is the First Past the Post (FPTP) system?",["The candidate who gets the highest number of votes wins.","All candidates win equally.","The candidate must always get 100% votes.","The government selects the winner."],0],
["Moderate","In the Proportional Representation (PR) system, seats are generally allocated according to:",["The age of candidates","The population of candidates' families","The proportion of votes received","The wealth of political parties"],2],
["Moderate","Why did India adopt the First Past the Post system for Lok Sabha elections?",["It makes voting compulsory.","It is relatively simple and gives a direct link between voters and representatives.","It allows only one political party.","It removes the need for elections."],1],
["Moderate","What is the main purpose of reserved constituencies for Scheduled Castes and Scheduled Tribes?",["To stop other citizens from voting","To give extra votes to some people","To remove elections","To ensure representation of historically disadvantaged communities."],3],
["Moderate","What is the main role of the Election Commission of India?",["To conduct and supervise elections","To make school textbooks","To appoint all ministers","To decide court cases"],0],
["High","In a constituency, Candidate A gets 40% votes, Candidate B gets 35%, and Candidate C gets 25%. Under FPTP, who wins?",["Candidate B","Candidate C","Candidate A","All three candidates"],2],
["High","Which is an important difference between FPTP and Proportional Representation?",["Both systems always give the same result.","FPTP elects the candidate with the highest votes, while PR aims to distribute seats according to vote share.","PR does not involve voting.","FPTP is used only in village elections."],1],
["High","Why is an independent Election Commission important for democracy?",["It allows the ruling party to control every election.","It prevents citizens from voting.","It removes political competition.","It helps ensure elections are conducted fairly and without improper government influence."],3],
["High","What is the purpose of electoral reforms?",["To improve the fairness, transparency and functioning of elections","To end the voting system","To remove all political parties","To allow only one candidate to contest"],0],
["High","Suppose a political party gets 40% of the total votes but wins 60% of the seats under an electoral system. What does this show?",["Votes and seats are always equal.","No election was conducted.","The number of seats won may not exactly match the percentage of votes received.","Every voter voted for the same party."],2]
];
var L="ABCD",ans,cur,start;
function $(i){return document.getElementById(i)}
function init(){ans=new Array(15).fill(-1);cur=0;start=Date.now();$("test").classList.remove("hide");$("result").classList.add("hide");window.scrollTo(0,0);show()}
function show(){
  var q=Q[cur],a=ans[cur];
  $("qno").textContent="Question "+(cur+1)+" of 15";
  $("lvl").textContent=q[0];
  $("qtext").textContent=q[1];
  var h="";
  q[2].forEach(function(t,i){
    var c="opt";
    if(a>-1){if(i===q[3])c+=" ok";else if(i===a)c+=" bad"}
    h+='<button class="'+c+'" data-i="'+i+'"'+(a>-1?' disabled':'')+'><b>'+L[i]+'.</b><span></span></button>';
  });
  $("opts").innerHTML=h;
  var bs=$("opts").children;
  for(var k=0;k<bs.length;k++){bs[k].lastChild.textContent=q[2][k];bs[k].onclick=pick}
  var fb="";
  if(a>-1){fb=a===q[3]?'<div class="fb ok">Correct! Well done.</div>':'<div class="fb bad">Wrong. Correct answer: '+L[q[3]]+'. '+esc(q[2][q[3]])+'</div>'}
  $("fb").innerHTML=fb;
  $("prev").disabled=cur===0;$("next").disabled=cur===14;
  var n="";
  for(var j=0;j<15;j++)n+='<button class="'+(ans[j]>-1?"done":"")+(j===cur?" cur":"")+'" data-j="'+j+'">'+(j+1)+'</button>';
  $("nav").innerHTML=n;
  var nb=$("nav").children;
  for(var m=0;m<nb.length;m++)nb[m].onclick=function(){cur=+this.dataset.j;show()};
}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function pick(){ if(ans[cur]>-1)return; ans[cur]=+this.dataset.i; show(); }
$("prev").onclick=function(){if(cur>0){cur--;show()}};
$("next").onclick=function(){if(cur<14){cur++;show()}};
$("submit").onclick=function(){
  var u=ans.filter(function(x){return x<0}).length;
  $("mtxt").textContent=u?("You have "+u+" unanswered question"+(u>1?"s":"")+". You cannot change answers after submitting."):"You have answered all questions. You cannot change answers after submitting.";
  $("modal").classList.add("show");
};
$("mno").onclick=function(){$("modal").classList.remove("show")};
$("myes").onclick=function(){$("modal").classList.remove("show");finish()};
$("restart").onclick=init;
function fmt(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m+" min "+(s%60)+" sec"}
function finish(){
  var el=Date.now()-start,c=0,w=0,u=0,lv={Easy:[0,0],Moderate:[0,0],High:[0,0]};
  Q.forEach(function(q,i){
    lv[q[0]][1]++;
    if(ans[i]<0)u++;else if(ans[i]===q[3]){c++;lv[q[0]][0]++}else w++;
  });
  $("score").textContent=c+" / 15";
  $("pct").textContent=Math.round(c/15*1000)/10+"% score";
  $("stats").innerHTML=[["Correct",c],["Wrong",w],["Unattempted",u],["Time taken",fmt(el)]].map(function(x){return '<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
  var t='<tr><th>Level</th><th>Correct</th><th>Total</th></tr>';
  for(var k in lv)t+='<tr><td>'+k+'</td><td>'+lv[k][0]+'</td><td>'+lv[k][1]+'</td></tr>';
  $("brk").innerHTML=t;
  var r="";
  Q.forEach(function(q,i){
    var a=ans[i],st=a<0?'<span class="n">Not attempted</span>':(a===q[3]?'<span class="g">Correct</span>':'<span class="r">Wrong</span>');
    r+='<div class="rv"><p><b>Q'+(i+1)+'. '+esc(q[1])+'</b> ('+q[0]+')</p><p>Your answer: '+(a<0?'<span class="n">None</span>':L[a]+'. '+esc(q[2][a]))+'</p><p>Correct answer: <span class="g">'+L[q[3]]+'. '+esc(q[2][q[3]])+'</span></p><p>'+st+'</p></div>';
  });
  $("review").innerHTML=r;
  $("test").classList.add("hide");$("result").classList.remove("hide");window.scrollTo(0,0);
}
init();
</script>
</body>
</html>
